<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Weather Forecast</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
    <main>
        <h1>7-day weather forecast</h1>

        <form id="search-form" role="search">
            <label for="query">Location</label>
            <div class="row">
                <input id="query" name="q" type="text" autocomplete="off" placeholder="Auckland or -36.85, 174.76"
                    aria-describedby="hint" required>
                <button type="submit" id="search-button">Search</button>
            </div>
            <p id="hint" class="hint">
                Try a city, an address, or coordinates like
                <code>-36.85, 174.76</code> or <code>36.85S 174.76E</code>.
            </p>
        </form>

        <div id="status" role="status" aria-live="polite"></div>
        <section id="results" aria-label="Forecast results"></section>
    </main>
    <script src="/js/app.js"></script>
</body>

</html>
